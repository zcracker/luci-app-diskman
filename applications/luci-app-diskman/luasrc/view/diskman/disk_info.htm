<style type="text/css">
  .dm-parts {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin: 4px 0 8px 0;
    background: #fff;
  }

  .dm-parts th {
    background: #f5f6fa;
    text-align: left;
    padding: 8px 12px;
    font-weight: 600;
    color: #4a5568;
    border-bottom: 1px solid #dfe2e8;
    white-space: nowrap;
  }

  .dm-parts td {
    padding: 8px 12px;
    border-bottom: 1px solid #eef0f4;
    white-space: nowrap;
    color: #333;
  }

  .dm-parts tbody tr:nth-child(odd) {
    background: #fafbfc;
  }

  .dm-parts tbody tr:hover {
    background: #eef3ff;
  }

  .dm-parts td.n {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .dm-parts td.mono {
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }

  .dm-parts-wrap > td {
    padding: 0 !important;
    border-bottom: 0 !important;
    background: #fff;
  }
</style>
<script type="text/javascript">//<![CDATA[
  function dm_parts_table(info) {
    if (!info || !info.partitions || !info.partitions.length)
      return ''

    // 表头与数据用同一套对齐规则，避免列间错位：全部左对齐
    var cols = ['名称', '起始扇区', '结束扇区', '大小', '已用', '可用', '使用率', '挂载点', '文件系统']
    var h = '<table class="dm-parts"><thead><tr>'
    for (var i = 0; i < cols.length; i++)
      h += '<th>' + cols[i] + '</th>'
    h += '</tr></thead><tbody>'

    info.partitions.forEach(function (p) {
      var name = (p.number > 0 && p.name && p.name != '-') ? p.name : '-'
      var fs = (p.fs && p.fs != 'Free Space') ? p.fs : '-'
      h += '<tr>'
        + '<td class="mono">' + name + '</td>'
        + '<td>' + (p.sec_start || '-') + '</td>'
        + '<td>' + (p.sec_end || '-') + '</td>'
        + '<td>' + (p.size_formated || '-') + '</td>'
        + '<td>' + (p.used_formated || '-') + '</td>'
        + '<td>' + (p.free_formated || '-') + '</td>'
        + '<td>' + (p.usage || '-') + '</td>'
        + '<td>' + (p.mount_point || '-') + '</td>'
        + '<td>' + fs + '</td>'
        + '</tr>'
    })

    h += '</tbody></table>'
    return h
  }

  function dm_inject_parts(item, info) {
    var table = dm_parts_table(info)
    if (!table)
      return

    var html
    if (item.nodeName == 'TR')
      html = '<tr class="dm-parts-wrap"><td colspan="15">' + table + '</td></tr>'
    else
      html = '<div class="tr cbi-section-table-row"><div style="width:100%">' + table + '</div></div>'

    item.insertAdjacentHTML('afterend', html)
  }

  window.onload = function () {
    // disk partition info
    var lines = document.querySelectorAll('[id^=cbi-disk-]')

    lines.forEach(function (item) {
      var dev = item.id.match(/cbi-disk-(.*)/)[1]
      if (dev == 'table')
        return

      XHR.get('<%=luci.dispatcher.build_url("admin/system/diskman/get_disk_info")%>/' + dev, null, function (x, disk_info) {
        item.childNodes.forEach(function (cell) {
          if (!cell || !cell.attributes)
            return

          var dn = cell.getAttribute('data-name')
          if (dn == 'sn' || (cell.childNodes[1] && cell.childNodes[1].id.match(/sn/)))
            cell.innerText = disk_info.sn || '-'
          else if (dn == 'temp' || (cell.childNodes[1] && cell.childNodes[1].id.match(/temp/)))
            cell.innerText = disk_info.temp || '-'
          else if (dn == 'p_table' || (cell.childNodes[1] && cell.childNodes[1].id.match(/p_table/)))
            cell.innerText = disk_info.p_table || '-'
          else if (dn == 'sata_ver' || (cell.childNodes[1] && cell.childNodes[1].id.match(/sata_ver/)))
            cell.innerText = disk_info.sata_ver || '-'
          else if (dn == 'health_status' || (cell.childNodes[1] && cell.childNodes[1].id.match(/health_status/)))
            cell.innerText = (disk_info.health || '-') + '\n' + (disk_info.status || '-')
          else if (dn == 'health' || (cell.childNodes[1] && cell.childNodes[1].id.match(/health/)))
            cell.innerText = disk_info.health || '-'
          else if (dn == 'status' || (cell.childNodes[1] && cell.childNodes[1].id.match(/status/)))
            cell.innerText = disk_info.status || '-'
        })

        dm_inject_parts(item, disk_info)
      })
    })

    // raid table
    lines = document.querySelectorAll('[id^=cbi-_raid-]')

    lines.forEach(function (item) {
      var dev = item.id.match(/cbi-_raid-(.*)/)[1]
      if (dev == 'table')
        return

      XHR.get('<%=luci.dispatcher.build_url("admin/system/diskman/get_disk_info")%>/' + dev, null, function (x, disk_info) {
        item.childNodes.forEach(function (cell) {
          if (!cell || !cell.attributes)
            return

          var dn = cell.getAttribute('data-name')
          if (dn == 'p_table' || (cell.childNodes[1] && cell.childNodes[1].id.match(/p_table/)))
            cell.innerText = disk_info.p_table || '-'
        })

        dm_inject_parts(item, disk_info)
      })
    })
  }
//]]></script>
